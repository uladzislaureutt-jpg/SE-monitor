name: S-monitor SetFit pilot (manual, isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-monitor-setfit-pilot
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface/transformers
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install pilot dependencies
        run: python -m pip install -r ml/setfit_pilot/requirements.txt

      - name: Validate frozen splits
        run: python ml/setfit_pilot/validate_splits.py --data data/ml/event_safe_v1

      - name: Train and evaluate compact SetFit
        run: >-
          python ml/setfit_pilot/train_setfit.py
          --data data/ml/event_safe_v1
          --output setfit-results
          --model-id cointegrated/rubert-tiny2
          --seed 20260822
          --batch-size 16
          --num-iterations 5
          --body-epochs 1
          --max-length 384

      - name: Upload isolated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-monitor-setfit-pilot-results
          path: setfit-results/
          if-no-files-found: error
          retention-days: 14
