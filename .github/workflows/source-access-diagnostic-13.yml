name: Source access diagnostic (14 candidates)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-access-diagnostic-14
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Result Event Integrity 1.16 (2026-08-30): the production
      # integration added to scripts/source_access_diagnostic.py (real
      # classify_source_url()/extract_article_from_html() checks, so a
      # "pass" here actually predicts what production would do — see
      # README) made `import social_monitor` a real, load-bearing
      # dependency of this diagnostic, not just something incidentally
      # importable. social_monitor.py itself imports requests/bs4/yaml/
      # dateutil at module level, and this workflow never installed them,
      # so both "Test diagnostic helpers" and the diagnostic run itself
      # failed outright with ModuleNotFoundError. Only the four packages
      # social_monitor.py needs at import time — not pytest, not
      # playwright (chromium rendering is never invoked by this read-only
      # diagnostic).
      - name: Install social_monitor.py import dependencies
        run: pip install "beautifulsoup4>=4.12,<5" "python-dateutil>=2.9,<3" "PyYAML>=6,<7" "requests>=2.32,<3"

      - name: Require production helpers
        run: |
          python -c "import social_monitor as m; assert callable(m.classify_source_url); assert callable(m.extract_article_from_html); print(m.MONITOR_BUILD)"

      # Scoped to this package's own test file specifically, not
      # `unittest discover -s tests` (which swept up the whole monitor's
      # tests/ directory once this package's tests/ merged into the
      # existing one — every test_result_event_integrity_*.py and
      # test_social_monitor.py file failed to import here too, none of
      # which this diagnostic is responsible for or should be coupled to).
      - name: Test diagnostic helpers
        run: python -m unittest tests/test_source_access_diagnostic.py -v

      - name: Run read-only availability and extraction diagnostic
        run: |
          python scripts/source_access_diagnostic.py \
            --candidates config/source_access_diagnostic_candidates.csv \
            --out-dir reports \
            --workers 3

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-access-diagnostic-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
